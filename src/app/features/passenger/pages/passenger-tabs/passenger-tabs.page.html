<ion-tabs>
  <ion-tab-bar slot="bottom" class="hg-tabs">
    <ion-tab-button tab="book">
      <ion-icon name="tricycle" aria-hidden="true" />
      <ion-label>{{ 'tabs.book' | t }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="rides">
      <ion-icon name="receipt-outline" aria-hidden="true" />
      <ion-label>{{ 'tabs.rides' | t }}</ion-label>
    </ion-tab-button>

    <!-- Phase 13: the badge counts unread alerts; screen readers hear "Alerts, 2 unread". -->
    <ion-tab-button tab="alerts">
      <ion-icon name="notifications-outline" aria-hidden="true" />
      <ion-label>{{ 'tabs.alerts' | t }}</ion-label>
      @if (notifications.unread() > 0) {
        <ion-badge class="hg-tab-badge"><span aria-hidden="true">{{ badge(notifications.unread()) }}</span><span class="hg-visually-hidden">{{ 'alerts.unreadAria' | t: { n: notifications.unread() } }}</span></ion-badge>
      }
    </ion-tab-button>

    <ion-tab-button tab="account">
      <ion-icon name="person-circle-outline" aria-hidden="true" />
      <ion-label>{{ 'tabs.account' | t }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>

<app-push-prompt role="passenger" />
