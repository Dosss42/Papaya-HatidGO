<ion-header class="ion-no-border">
  <ion-toolbar class="hg-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/auth/welcome" text="" />
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form class="hg-column auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <header class="hg-head">
      <h1 class="hg-head__title">{{ 'login.title' | t }}</h1>
      <p class="hg-head__lead">{{ 'login.lead' | t }}</p>
    </header>

    @if (error(); as e) {
      @if (!e.fieldErrors['login'] && !e.fieldErrors['password']) {
        <p class="hg-notice hg-notice--alert" role="alert">
          <ion-icon name="alert-circle" aria-hidden="true" />
          <span>{{ e.message }}</span>
        </p>
      }
    }

    <label class="hg-field">
      <span class="hg-field__label">{{ 'login.loginLabel' | t }}</span>
      <ion-input
        formControlName="login"
        fill="outline"
        type="text"
        autocomplete="username"
        [placeholder]="'login.loginPlaceholder' | t"
        [clearInput]="true"
      />
      @if (fieldError('login'); as msg) {
        <span class="hg-field__error"><ion-icon name="alert-circle" aria-hidden="true" />{{ msg }}</span>
      }
    </label>

    <label class="hg-field">
      <span class="hg-field__label">{{ 'login.password' | t }}</span>
      <ion-input formControlName="password" fill="outline" type="password" autocomplete="current-password">
        <ion-input-password-toggle
          slot="end"
          color="medium"
          [attr.show-label]="'common.showPassword' | t"
          [attr.hide-label]="'common.hidePassword' | t"
        />
      </ion-input>
      @if (fieldError('password'); as msg) {
        <span class="hg-field__error"><ion-icon name="alert-circle" aria-hidden="true" />{{ msg }}</span>
      }
    </label>

    <button class="hg-button hg-button--primary" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <ion-spinner name="crescent" aria-hidden="true" /> {{ 'login.submitting' | t }}
      } @else {
        {{ 'login.submit' | t }}
      }
    </button>

    <a class="hg-button hg-button--text" routerLink="/auth/forgot-password">{{ 'login.forgot' | t }}</a>

    <div class="auth-form__divider" aria-hidden="true"></div>

    <a class="hg-button hg-button--outline" routerLink="/auth/register">{{ 'login.noAccount' | t }}</a>

    @if (isDev) {
      <div class="auth-form__dev">
        <span>Dev accounts · password "password"</span>
        <button type="button" (click)="fillDev('pasahero1@example.test')">Maria · pasahero</button>
        <button type="button" (click)="fillDev('driver1@example.test')">Juan · driver</button>
        <button type="button" (click)="fillDev('admin@example.test')">Ana · admin</button>
      </div>
    }
  </form>
</ion-content>
