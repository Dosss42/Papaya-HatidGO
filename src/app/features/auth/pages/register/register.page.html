<ion-header class="ion-no-border">
  <ion-toolbar class="hg-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/auth/welcome" text="" />
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form class="hg-column auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <header class="hg-head">
      <h1 class="hg-head__title">{{ 'register.title' | t }}</h1>
    </header>

    <fieldset class="role-plates">
      <legend class="hg-field__label">{{ 'register.who' | t }}</legend>
      <div class="role-plates__row" role="radiogroup" [attr.aria-label]="'register.who' | t">
        <button
          type="button"
          class="role-plate"
          role="radio"
          [attr.aria-checked]="form.controls.role.value === 'passenger'"
          [class.role-plate--on]="form.controls.role.value === 'passenger'"
          (click)="chooseRole('passenger')"
        >
          <ion-icon class="role-plate__icon" name="person-outline" aria-hidden="true" />
          <span class="role-plate__title">{{ 'role.passenger' | t }}</span>
          @if (form.controls.role.value === 'passenger') {
            <ion-icon class="role-plate__check" name="checkmark-circle" aria-hidden="true" />
          }
        </button>
        <button
          type="button"
          class="role-plate"
          role="radio"
          [attr.aria-checked]="form.controls.role.value === 'driver'"
          [class.role-plate--on]="form.controls.role.value === 'driver'"
          (click)="chooseRole('driver')"
        >
          <ion-icon class="role-plate__icon" name="tricycle" aria-hidden="true" />
          <span class="role-plate__title">{{ 'role.driver' | t }}</span>
          @if (form.controls.role.value === 'driver') {
            <ion-icon class="role-plate__check" name="checkmark-circle" aria-hidden="true" />
          }
        </button>
      </div>
      @if (form.controls.role.value === 'driver') {
        <p class="role-plates__note">
          {{ 'register.driverNote' | t }}
        </p>
      }
    </fieldset>

    @if (error(); as e) {
      @if (!hasFieldErrors(e)) {
        <p class="hg-notice hg-notice--alert" role="alert">
          <ion-icon name="alert-circle" aria-hidden="true" />
          <span>{{ e.message }}</span>
        </p>
      }
    }

    <div class="name-pair">
      <label class="hg-field">
        <span class="hg-field__label">{{ 'register.firstName' | t }}</span>
        <ion-input formControlName="first_name" fill="outline" autocomplete="given-name" autocapitalize="words" />
        @if (fieldError('first_name'); as msg) {
          <span class="hg-field__error"><ion-icon name="alert-circle" aria-hidden="true" />{{ msg }}</span>
        }
      </label>
      <label class="hg-field">
        <span class="hg-field__label">{{ 'register.lastName' | t }}</span>
        <ion-input formControlName="last_name" fill="outline" autocomplete="family-name" autocapitalize="words" />
        @if (fieldError('last_name'); as msg) {
          <span class="hg-field__error"><ion-icon name="alert-circle" aria-hidden="true" />{{ msg }}</span>
        }
      </label>
    </div>

    <label class="hg-field">
      <span class="hg-field__label">{{ 'register.phone' | t }}</span>
      <ion-input formControlName="phone" fill="outline" type="tel" inputmode="tel" autocomplete="tel" [placeholder]="'register.phonePlaceholder' | t" />
      @if (fieldError('phone'); as msg) {
        <span class="hg-field__error"><ion-icon name="alert-circle" aria-hidden="true" />{{ msg }}</span>
      }
    </label>

    <label class="hg-field">
      <span class="hg-field__label">{{ 'register.email' | t }}</span>
      <span class="hg-field__hint">{{ 'register.emailHint' | t }}</span>
      <ion-input formControlName="email" fill="outline" type="email" inputmode="email" autocomplete="email" [placeholder]="'register.emailPlaceholder' | t" />
      @if (fieldError('email'); as msg) {
        <span class="hg-field__error"><ion-icon name="alert-circle" aria-hidden="true" />{{ msg }}</span>
      }
    </label>

    <label class="hg-field">
      <span class="hg-field__label">{{ 'register.password' | t }}</span>
      <span class="hg-field__hint">{{ 'register.passwordHint' | t }}</span>
      <ion-input formControlName="password" fill="outline" type="password" autocomplete="new-password">
        <ion-input-password-toggle slot="end" color="medium" [attr.show-label]="'common.showPassword' | t" [attr.hide-label]="'common.hidePassword' | t" />
      </ion-input>
      @if (fieldError('password'); as msg) {
        <span class="hg-field__error"><ion-icon name="alert-circle" aria-hidden="true" />{{ msg }}</span>
      }
    </label>

    <label class="hg-field">
      <span class="hg-field__label">{{ 'register.confirm' | t }}</span>
      <ion-input formControlName="password_confirmation" fill="outline" type="password" autocomplete="new-password">
        <ion-input-password-toggle slot="end" color="medium" [attr.show-label]="'common.showPassword' | t" [attr.hide-label]="'common.hidePassword' | t" />
      </ion-input>
      @if (fieldError('password_confirmation'); as msg) {
        <span class="hg-field__error"><ion-icon name="alert-circle" aria-hidden="true" />{{ msg }}</span>
      }
    </label>

    <button class="hg-button hg-button--primary" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <ion-spinner name="crescent" aria-hidden="true" /> {{ 'register.submitting' | t }}
      } @else {
        {{ 'register.submit' | t }}
      }
    </button>

    <a class="hg-button hg-button--text" routerLink="/auth/login"><span>{{ 'register.haveAccount' | t }} <span class="hg-nowrap">{{ 'register.loginLink' | t }}</span></span></a>
  </form>
</ion-content>
