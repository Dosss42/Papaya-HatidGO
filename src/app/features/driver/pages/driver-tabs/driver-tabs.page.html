<ion-tabs>
  <ion-tab-bar slot="bottom" class="hg-tabs">
    <ion-tab-button tab="home">
      <ion-icon name="home-outline" aria-hidden="true" />
      <ion-label>{{ 'tabs.home' | t }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="rides">
      <ion-icon name="receipt-outline" aria-hidden="true" />
      <ion-label>{{ 'tabs.rides' | t }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="earnings">
      <ion-icon name="wallet-outline" aria-hidden="true" />
      <ion-label>{{ 'tabs.earnings' | t }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="account">
      <ion-icon name="person-circle-outline" aria-hidden="true" />
      <ion-label>{{ 'tabs.account' | t }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>

<!-- Phase 11: an incoming request interrupts whichever tab is open (driver-home brief § 4). -->
<app-request-alert />
